<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Моя веб-карта</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // 1. Создаём карту и центрируем её
    var map = L.map('map').setView([55.7558, 37.6173], 5);

    // 2. Базовый слой — OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 19
    }).addTo(map);

    // 3. Загружаем точки из data.geojson
    fetch('data.geojson')
      .then(r => r.json())
      .then(data => {
        L.geoJSON(data, {
          // Стиль для линий и полигонов
          style: function () {
            return { color: '#e74c3c', weight: 2, fillOpacity: 0.3 };
          },
          // Точки — маркеры
          pointToLayer: function (feature, latlng) {
            return L.marker(latlng);
          },
          // Всплывашка при клике — все свойства из properties
          onEachFeature: function (feature, layer) {
            if (feature.properties) {
              var html = '';
              for (var key in feature.properties) {
                html += '<b>' + key + ':</b> ' + feature.properties[key] + '<br>';
              }
              layer.bindPopup(html);
            }
          }
        }).addTo(map);
      })
      .catch(err => console.error('Ошибка загрузки data.geojson:', err));
  </script>
</body>
</html>
